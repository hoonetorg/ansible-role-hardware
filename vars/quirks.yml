---
# Hardware quirks, enabled per host with hardware.quirks: [<name>, ...]. The name describes the fix, the
# comment names the machine it was needed on. Module options of quirks can break other hardware - enable a
# quirk only on the machine it is meant for.
# kinds: firmware_links (link, target), modprobe (lines), files (path, content), usb_unmap (USB IDs)
hardware_quirks_catalog:
  # Lenovo ThinkBook 16p Gen6: the CS35L56 amps request the firmware names without "-spkid1", but
  # linux-firmware only ships the -spkid1 variants → only the tweeters play (no woofers)
  cirrus-cs35l56-17aa3921-spkid1:
    firmware_links:
      - { link: cirrus/cs35l56-b0-dsp1-misc-17aa3921.wmfw.xz, target: cs35l56-b0-dsp1-misc-17aa3921-spkid1.wmfw.xz }
      - { link: cirrus/cs35l56-b0-dsp1-misc-17aa3921-amp1.bin.xz, target: cs35l56-b0-dsp1-misc-17aa3921-spkid1-amp1.bin.xz }
      - { link: cirrus/cs35l56-b0-dsp1-misc-17aa3921-amp2.bin.xz, target: cs35l56-b0-dsp1-misc-17aa3921-spkid1-amp2.bin.xz }
  # Fujitsu LIFEBOOK E5512: the 4 digital microphones are not detected (SOF digital-mic issue,
  # https://thesofproject.github.io/latest/getting_started/intel_debug/suggestions.html#digital-mic-issues);
  # on other Intel SOF machines this breaks the internal microphone
  sof-dmic-num-4:
    modprobe: ["options snd_sof_intel_hda_generic dmic_num=4"]
  # Lenovo ThinkPad E16 Gen 2: Bluetooth unstable with USB autosuspend
  btusb-no-autosuspend:
    modprobe: ["options btusb enable_autosuspend=0"]
  # Lenovo IdeaPad 5 2-in-1 15AGP11: pen digitizer i2c 056a:5440 is not in libwacom (checked up to 2.20)
  libwacom-isdv4-5440:
    files:
      - path: /etc/libwacom/wacom-isdv4-5440.tablet
        content: |
          [Device]
          Name=Wacom ISDv4 5440
          ModelName=
          DeviceMatch=i2c|056a|5440
          Class=ISDV4
          Width=13
          Height=8
          IntegratedIn=Display;System
          Styli=@isdv4-aes;

          [Features]
          Stylus=true
          Touch=true
  # Lenovo ThinkBook 16p Gen6: the battery cuts off hard at about 3% → clean power-off earlier.
  # UPower needs Low > Critical > Action, otherwise it uses its defaults (20/5/2).
  upower-poweroff-early:
    files:
      - path: /etc/UPower/UPower.conf.d/50-hardware-quirk-battery.conf
        content: |
          [UPower]
          PercentageLow={{ hardware_final.battery_poweroff_percent | int + 10 }}
          PercentageCritical={{ hardware_final.battery_poweroff_percent | int + 5 }}
          PercentageAction={{ hardware_final.battery_poweroff_percent | int }}
          CriticalPowerAction=PowerOff
  # USB storage that supports UNMAP but does not announce it → no TRIM/discard (lsblk -D shows 0).
  # Not machine-specific: the rule only acts on the listed USB IDs. One line per device.
  usb-unmap:
    usb_unmap:
      - 152d:0562   # USB-SATA adapter, 4 TB enterprise drive
      - 2109:0715   # USB-SATA adapter
      - 152d:0583   # JMS583 NVMe bridge, e.g. ICY BOX IB-1817M-C31
      - 0bc2:208e   # Seagate Ultra Compact SSD
      - 0bda:9210   # Orico M.2 enclosure, RTL9210
      - 090c:1000   # Samsung FIT 256GB
